# Known failure types the live monitor watches for ("signatures"), as data. Source: the Tennessee Eastman lookup
# in message.txt (fault -> most affected columns -> what to look for). Judges can add their own failure types by
# dropping another *.yaml with the same layout into the live monitor's data folder (workspace/_live/signatures/);
# an entry with the same id replaces this one. This file is local data: it is never sent to any model or API.
#
# Fields per signature
#   id           short unique id (letters, digits, - _)
#   fault        the fault number in the source document (informational)
#   name         plain words: what it is and how it shows (name_fi / name_sv optional translations)
#   columns      the sensors it shows on, as named in the data file (matched by exact name, case-insensitive name,
#                positional alias S01.. or an operator display name); [] = generic, matched on any sensors
#   pattern      mean_shift | variance_increase | collapse | slow_drift | jumpy | brief_bump | fading_shift | none
#   confidence   documented (the source states it) | hypothesis (the source is less sure)
#   visible      false = the source says this fault is not reliably visible in the sensors; kept, shown as such, never alarmed
#   suggestion   what an operator should do when this failure is approaching (suggestion_fi / suggestion_sv optional)
#   note         free text shown in the details
version: 1
signatures:
  - id: F01
    fault: 1
    name: "Fault 1: A/C feed ratio step (B composition constant) - mean shift"
    name_fi: "Vika 1: A/C-syöttösuhteen askelmuutos - tason siirtymä"
    name_sv: "Fel 1: stegändring i A/C-matningsförhållandet - nivåförskjutning"
    columns: [xmeas_1, xmeas_4, xmv_3]
    pattern: mean_shift
    confidence: documented
    visible: true
    suggestion: "Check the A feed (stream 1) and the A and C feed (stream 4): the A feed valve (xmv_3) is compensating for a changed feed ratio. Verify the feed composition upstream and inform the shift engineer; hold set-points until the feed is confirmed."
    suggestion_fi: "Tarkista A-syöttö (virta 1) ja A+C-syöttö (virta 4): A-syötön venttiili (xmv_3) kompensoi muuttunutta syöttösuhdetta. Varmista syötön koostumus ylävirrassa ja ilmoita vuoroinsinöörille; pidä asetusarvot ennallaan kunnes syöttö on varmistettu."
    suggestion_sv: "Kontrollera A-matningen (ström 1) och A+C-matningen (ström 4): A-matningsventilen (xmv_3) kompenserar för ett ändrat matningsförhållande. Verifiera matningens sammansättning uppströms och informera skiftingenjören; håll börvärdena tills matningen är bekräftad."
  - id: F02
    fault: 2
    name: "Fault 2: B composition step in the feed - mean shift"
    name_fi: "Vika 2: B-koostumuksen askelmuutos syötössä - tason siirtymä"
    name_sv: "Fel 2: stegändring i B-halten i matningen - nivåförskjutning"
    columns: [xmeas_10, xmeas_30]
    pattern: mean_shift
    confidence: documented
    visible: true
    suggestion: "The purge rate (xmeas_10) and the B content of the purge gas (xmeas_30) have shifted: an inert (B) is building up. Check the feed composition of stream 4 and the purge valve; let the purge controller work and inform the shift engineer."
    suggestion_fi: "Huuhtelun virtaus (xmeas_10) ja huuhtelukaasun B-pitoisuus (xmeas_30) ovat siirtyneet: inertti aine (B) kertyy. Tarkista virran 4 syötön koostumus ja huuhteluventtiili; anna huuhtelusäädön toimia ja ilmoita vuoroinsinöörille."
    suggestion_sv: "Avblåsningsflödet (xmeas_10) och B-halten i avblåsningsgasen (xmeas_30) har förskjutits: en inert komponent (B) ackumuleras. Kontrollera matningens sammansättning i ström 4 och avblåsningsventilen; låt avblåsningsregulatorn arbeta och informera skiftingenjören."
  - id: F03
    fault: 3
    name: "Fault 3: D feed temperature step - essentially invisible"
    name_fi: "Vika 3: D-syötön lämpötilan askelmuutos - käytännössä näkymätön"
    name_sv: "Fel 3: stegändring i D-matningens temperatur - i praktiken osynlig"
    columns: []
    pattern: none
    confidence: documented
    visible: false
    suggestion: "Not reliably visible in the sensors; the control loops absorb it. No sensor-based warning is possible."
    suggestion_fi: "Ei luotettavasti näkyvissä antureissa; säätöpiirit vaimentavat sen. Anturipohjainen varoitus ei ole mahdollinen."
    suggestion_sv: "Syns inte tillförlitligt i sensorerna; reglerkretsarna absorberar det. Ingen sensorbaserad varning är möjlig."
  - id: F04
    fault: 4
    name: "Fault 4: reactor cooling water inlet temperature step - brief reactor temperature bump, the valve compensates"
    name_fi: "Vika 4: reaktorin jäähdytysveden tulolämpötilan askelmuutos - lyhyt lämpötilapiikki, venttiili kompensoi"
    name_sv: "Fel 4: stegändring i reaktorkylvattnets inloppstemperatur - kort temperaturtopp, ventilen kompenserar"
    columns: [xmeas_21, xmeas_9, xmv_10]
    pattern: brief_bump
    confidence: documented
    visible: true
    suggestion: "The reactor cooling water outlet temperature (xmeas_21) jumped and the cooling water valve (xmv_10) opened to hold the reactor temperature (xmeas_9). Check the cooling water supply temperature; the process is under control while the valve has room to move."
    suggestion_fi: "Reaktorin jäähdytysveden lähtölämpötila (xmeas_21) hyppäsi ja jäähdytysveden venttiili (xmv_10) avautui pitääkseen reaktorin lämpötilan (xmeas_9). Tarkista jäähdytysveden tulolämpötila; prosessi on hallinnassa niin kauan kuin venttiilillä on säätövaraa."
    suggestion_sv: "Reaktorkylvattnets utloppstemperatur (xmeas_21) hoppade och kylvattenventilen (xmv_10) öppnade för att hålla reaktortemperaturen (xmeas_9). Kontrollera kylvattnets tilloppstemperatur; processen är under kontroll så länge ventilen har reglerutrymme."
  - id: F05
    fault: 5
    name: "Fault 5: condenser cooling water inlet temperature step - shift that partly fades as control compensates"
    name_fi: "Vika 5: lauhduttimen jäähdytysveden tulolämpötilan askelmuutos - siirtymä, joka osin häviää säädön kompensoidessa"
    name_sv: "Fel 5: stegändring i kondensorkylvattnets inloppstemperatur - förskjutning som delvis avtar när regleringen kompenserar"
    columns: [xmeas_22, xmeas_11]
    pattern: fading_shift
    confidence: documented
    visible: true
    suggestion: "The separator cooling water outlet temperature (xmeas_22) and the separator temperature (xmeas_11) shifted. Check the condenser cooling water supply; the controllers will pull the separator back, so watch that the condenser valve (xmv_11) does not run out of range."
    suggestion_fi: "Erottimen jäähdytysveden lähtölämpötila (xmeas_22) ja erottimen lämpötila (xmeas_11) siirtyivät. Tarkista lauhduttimen jäähdytysveden syöttö; säätimet palauttavat erottimen, joten seuraa ettei lauhduttimen venttiili (xmv_11) ajaudu ääriasentoon."
    suggestion_sv: "Separatorkylvattnets utloppstemperatur (xmeas_22) och separatortemperaturen (xmeas_11) förskjöts. Kontrollera kondensorns kylvattentillförsel; regulatorerna drar tillbaka separatorn, så se till att kondensorventilen (xmv_11) inte når sitt ändläge."
  - id: F06
    fault: 6
    name: "Fault 6: A feed loss - large, fast collapse"
    name_fi: "Vika 6: A-syötön menetys - suuri, nopea romahdus"
    name_sv: "Fel 6: förlust av A-matningen - stor, snabb kollaps"
    columns: [xmeas_1, xmv_3, xmeas_4]
    pattern: collapse
    confidence: documented
    visible: true
    suggestion: "The A feed (xmeas_1) is collapsing while its valve (xmv_3) opens fully: the A supply is lost. Check the A feed line, its upstream supply and the valve at once; be ready to hold or shut down the process, because the reactor pressure will rise. Inform the shift engineer immediately."
    suggestion_fi: "A-syöttö (xmeas_1) romahtaa samalla kun sen venttiili (xmv_3) avautuu täysin: A:n syöttö on menetetty. Tarkista A-syöttölinja, sen ylävirran syöttö ja venttiili heti; varaudu pysäyttämään prosessi, koska reaktorin paine nousee. Ilmoita vuoroinsinöörille välittömästi."
    suggestion_sv: "A-matningen (xmeas_1) kollapsar medan dess ventil (xmv_3) öppnar helt: A-tillförseln är förlorad. Kontrollera A-matningsledningen, tillförseln uppströms och ventilen genast; var beredd att hålla eller stoppa processen eftersom reaktortrycket kommer att stiga. Informera skiftingenjören omedelbart."
