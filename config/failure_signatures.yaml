  # Generic signatures: no fixed sensors. They match on whichever sensors show the pattern most, so a file with any
  # column names still gets a cause in plain words ("a mean shift on temperature and flow").
  - id: G-shift
    name: "Generic: mean shift on some sensors"
    name_fi: "Yleinen: tason siirtymä joillakin antureilla"
    name_sv: "Generellt: nivåförskjutning på några sensorer"
    columns: []
    generic: true
    pattern: mean_shift
    confidence: hypothesis
    visible: true
    suggestion: "The listed sensors have settled at a new level. Check what changed upstream of them (feed, set-point, utility) before touching the instruments; if nothing changed in the process, check the sensors themselves. Inform the shift engineer."
    suggestion_fi: "Luetellut anturit ovat asettuneet uudelle tasolle. Tarkista, mikä muuttui niiden ylävirrassa (syöttö, asetusarvo, käyttöhyödyke) ennen kuin kosket instrumentteihin; jos prosessissa ei muuttunut mitään, tarkista anturit itse. Ilmoita vuoroinsinöörille."
    suggestion_sv: "De listade sensorerna har lagt sig på en ny nivå. Kontrollera vad som ändrades uppströms dem (matning, börvärde, hjälpsystem) innan instrumenten rörs; om inget ändrades i processen, kontrollera sensorerna själva. Informera skiftingenjören."
  - id: G-variance
    name: "Generic: readings much more unsteady than normal on some sensors"
    name_fi: "Yleinen: lukemat huomattavasti epävakaampia kuin normaalisti joillakin antureilla"
    name_sv: "Generellt: mätvärden betydligt ostadigare än normalt på några sensorer"
    columns: []
    generic: true
    pattern: variance_increase
    confidence: hypothesis
