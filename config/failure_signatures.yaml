    suggestion_sv: "Tryck (reaktor xmeas_7, separator xmeas_13, stripper xmeas_16), nivåer (xmeas_8, xmeas_12, xmeas_15) och sammansättningar driver långsamt tillsammans: själva reaktionen förändras. Inget att åtgärda vid en ventil; informera skiftingenjören och planera en översyn av börvärdena innan driften når gränserna."
