    suggestion: "The A and C feed (xmeas_4) dropped and its valve (xmv_4) opened to compensate: the C header pressure is low. Check the C supply header and its pressure; hold set-points until the header pressure is back."
    suggestion_fi: "A+C-syöttö (xmeas_4) laski ja sen venttiili (xmv_4) avautui kompensoidakseen: C-jakotukin paine on matala. Tarkista C-syötön jakotukki ja sen paine; pidä asetusarvot ennallaan kunnes paine on palautunut."
    suggestion_sv: "A+C-matningen (xmeas_4) sjönk och dess ventil (xmv_4) öppnade för att kompensera: trycket i C-samlingsledningen är lågt. Kontrollera C-samlingsledningen och dess tryck; håll börvärdena tills trycket är tillbaka."
