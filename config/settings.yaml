# Trustworthy Process Monitor settings. Every team decision that may change later is a key here.
# Environment overrides: TPM_PROFILE, TPM_LOCAL_MODEL, TPM_EXTERNAL_MODEL, ANTHROPIC_API_KEY, OLLAMA_HOST,
# TPM_WORKSPACE, TPM_TIME_BUDGET_S. Secrets live in .env (never here).

profile: no-egress            # default: nothing leaves the machine

profiles:
  no-egress:
    description: Full pipeline on the local model. No network model calls at all.
    allow_external: false
    guard_strict: true
    routing:
      column_roles: local
      sensor_hypotheses: local
      rule_compile: local
      diagnosis_narrative: local
      critique: local
      why_chat: local
      assessor_chat: local
      report_narrative: local
  hybrid:
    description: Raw-data tasks local; derived-artifact tasks may go to Anthropic through the egress guard (aggregated, rounded, aliased data only).
    allow_external: true
    guard_strict: false
    routing:
      column_roles: local             # sees raw sample values: never external
      sensor_hypotheses: external
      rule_compile: external
      diagnosis_narrative: external
      critique: external
      why_chat: external              # tool agent in external mode: aggregate-only tools, every result through the guard
      assessor_chat: external
      report_narrative: external
  eu-hosted:
    description: Same routing as hybrid but the external endpoint is an EU-hosted deployment (set external_llm.base_url).
    allow_external: true
    guard_strict: true
    require_custom_endpoint: true     # unavailable until external_llm.base_url points at a non-anthropic.com host
    routing:
      column_roles: local
      sensor_hypotheses: external
      rule_compile: external
      diagnosis_narrative: external
      critique: external
      why_chat: external
      assessor_chat: external
      report_narrative: external

local_llm:
  provider: ollama
  base_url: http://localhost:11434
  model: gemma4:e4b-it-qat          # 6.1 GB, fits 8 GB VRAM with context; tool/JSON capable
  fallback_models: [qwen3:8b, granite4.1:8b, llama3:8b, gemma3:4b]
  embedding_model: nomic-embed-text
  keep_alive: 5m
  num_ctx: 8192
  temperature: 0.2
  timeout_s: 180
  max_tool_steps: 8

external_llm:
  provider: anthropic
  model: claude-sonnet-5            # or claude-opus-5; never a Fable / Mythos model (30-day data retention)
  model_by_task: {}                 # optional, e.g. {critique: claude-opus-5}
  allowed_model_patterns: [sonnet, opus]  # a model id must contain one of these ...
  blocked_model_patterns: [fable, mythos] # ... and none of these (checked on the lower-cased id)
  api_key_env: ANTHROPIC_API_KEY
  base_url: null                    # set to an EU-hosted endpoint for the eu-hosted profile
  max_tokens: 4096                  # output cap per call (thinking tokens count toward it)
  effort: low                       # low | medium | high | xhigh | max; low is the fastest
  timeout_s: 60
  max_calls_per_run: 200            # successful external calls per run workspace (pipeline + chat)
  max_calls_per_chat_turn: 6
  max_output_tokens_per_run: 120000
  max_parallel: 6                   # concurrent external calls
  max_narratives_per_run: 12        # diagnoses that get narrative + critique when the route is external

guard:
  min_aggregate_n: 30               # aggregates must be computed over >= this many samples
  max_series_points: 20             # no series longer than this leaves the machine
  max_numeric_values_per_payload: 4000  # a 50-signal catalog carries ~1300 rounded aggregates
  max_payload_bytes: 200000
  allow_column_names: true          # legacy switch; alias_names_external below decides for external profiles
  alias_column_names_in_strict: true
  forbid_categorical_values: true   # no categorical / free-text record values (PII risk)
  forbid_row_like_structures: true
  external_sig_digits: 3            # every float that leaves is rounded to this many significant digits
  alias_names_external: true        # original column names never leave, in any external profile
  drop_keys_external: [min, max, first, last, value, values_at, observed, reading, readings, raw, sample, samples,
                       rows, points, series, time, timestamp, start_time, end_time, t_start, t_end, source_path,
                       file, filename, path, evaluation, label, labels]

ingest:
  blind_mode: true                  # infer on aliases S01..Snn; names are weak evidence only
  max_memory_fraction: 0.35         # of currently free RAM for any single in-memory block
  chunk_rows: 200000
  sample_rows_for_typing: 50000
  max_columns: 5000
  parquet_compression: zstd
  dtype_downcast: float32

batch:
  window_seconds: 300               # 5-minute batches when a timestamp exists
  fallback_fraction: 0.10           # else 10 % of rows per batch
  min_rows: 100
  max_rows: 2000000

quality:
  stuck_min_run: 30                 # consecutive identical samples to call a signal stuck (continuous signals)
  stuck_fraction_warn: 0.5
  missing_warn: 0.02
  missing_fail: 0.20
  range_sigma: 6                    # robust z beyond this is out-of-range
  spike_sigma: 10                   # local spike: distance from the rolling median in units of local noise
  spike_min_scale: 0.15             # ...and at least this share of the signal's own robust spread
  spike_window: 7                   # rolling-median window (samples)
  spike_max_len: 2                  # a local spike is at most this many consecutive readings
  gap_factor: 3                     # timestamp gap > gap_factor * median period
  trust_fail_threshold: 0.5         # trust_score below this => "data cannot be trusted" banner
  critical_signal_fraction: 0.3     # if > this share of signals fail, batch is untrusted

rules:
  allow_role_names: false           # rules may name inferred roles ("reactor pressure") when true
  auto_activate_on_approve: true

detect:
  n_folds: 5
  max_fit_rows: 300000
  window: 20
  time_budget_s: 450                # detect stage: 7.5 minutes of the 20-minute overall budget
  detectors: [pca, robust_z, ewma, cusum, corr_break, iforest, autoencoder]
  use_autoencoder: true
  autoencoder_max_rows: 60000
  contamination_prior: 0.1
  min_event_len: 5
  pattern_min_events: 3
  leakage_guard: true

assessor:
  learning_curve_fractions: [0.1, 0.2, 0.4, 0.7, 1.0]
  holdback_fraction: 0.2
  experiment_time_budget_s: 90

report:
  default_language: en
  languages: [en, fi, sv]
  smtp:
    host_env: TPM_SMTP_HOST
    port_env: TPM_SMTP_PORT
    user_env: TPM_SMTP_USER
    password_env: TPM_SMTP_PASSWORD
    from_env: TPM_SMTP_FROM

workspace_dir: workspace
time_budget_s: 1200                 # 20 minutes for a full pass on a 6 GB file
